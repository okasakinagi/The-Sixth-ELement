name: CI/CD — Deploy Docker images to single server via SSH

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch: {}

jobs:
  build-and-deploy-docker:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    env:
      APP_DIR: ${{ secrets.APP_DIR }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-arch) and Docker buildx
        uses: docker/setup-buildx-action@v2

      # NOTE: Build will be performed on the server by pulling the repository
      # This avoids transferring large image tarballs and lets the server build images locally

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${SSH_PORT:-22} ${SSH_HOST} >> ~/.ssh/known_hosts

      - name: Deploy on server (git pull, build, up)
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
        run: |
          # Ensure remote repo is updated and built on the server; repository is public so no token required
          ssh -p ${SSH_PORT:-22} -i ~/.ssh/id_rsa ${SSH_USER}@${SSH_HOST} "APP_DIR='${APP_DIR}' DB_HOST='${DB_HOST}' DB_PORT='${DB_PORT}' DB_NAME='${DB_NAME}' DB_USER='${DB_USER}' DB_PASSWORD='${DB_PASSWORD}' DB_ROOT_PASSWORD='${DB_ROOT_PASSWORD}' DJANGO_SECRET_KEY='${DJANGO_SECRET_KEY}' GITHUB_REPOSITORY='${GITHUB_REPOSITORY}' bash -s" <<'SSH'
          set -e
          mkdir -p "${APP_DIR}"
          # create .env from secrets so docker-compose has DB_* values
          cat > ${APP_DIR}/.env <<ENV
          DEBUG=False
          DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
          DJANGO_DEBUG=0
          DJANGO_DB_HOST=${DB_HOST}
          DJANGO_DB_PORT=${DB_PORT}
          DJANGO_DB_NAME=${DB_NAME}
          DJANGO_DB_USER=${DB_USER}
          DJANGO_DB_PASSWORD=${DB_PASSWORD}
          DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
          ENV
          # If repo already exists, reset to origin/main; otherwise clone
          if [ -d "${APP_DIR}/.git" ]; then
            cd "${APP_DIR}"
            git fetch --all
            git reset --hard origin/main
          else
            rm -rf "${APP_DIR}"/* || true
            GIT_URL="https://github.com/${GITHUB_REPOSITORY}.git"
            git clone "$GIT_URL" "${APP_DIR}"
          fi
          cd "${APP_DIR}"
          # Build and start containers on the server
          docker compose -f deploy/docker-compose.yml build --no-cache || true
          docker compose -f deploy/docker-compose.yml up -d --remove-orphans
          # Run migrations and collectstatic
          docker compose -f deploy/docker-compose.yml run --rm web python Main.py migrate || true
          docker compose -f deploy/docker-compose.yml run --rm web python Main.py collectstatic --noinput || true
          SSH
        shell: bash

      # .env is created on the server as part of the Deploy step above

      - name: Load images and start with docker-compose on server
        run: |
          ssh -p ${SSH_PORT:-22} ${SSH_USER}@${SSH_HOST} "bash -s" <<'SSH'
          set -e
          cd "${APP_DIR}"
          # 加载镜像
          docker load -i images.tar
          # 启动或更新服务
          docker-compose -f docker-compose.yml up -d --remove-orphans
          # 运行数据库迁移（在容器内）
          docker-compose -f docker-compose.yml run --rm web python Main.py migrate || true
          SSH
