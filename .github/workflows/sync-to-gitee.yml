# GitHub Action配置：自动同步代码到Gitee
name: Sync GitHub to Gitee

# 触发条件：推送到main分支时同步（可根据你的分支名修改，比如master）
on:
  push:
    branches: [main]
  # 可选：手动触发同步（方便测试）
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 步骤1：拉取GitHub仓库的代码（含所有提交记录）
      - name: Checkout GitHub code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 必须拉取所有历史，否则同步不完整

      # 步骤2：配置SSH密钥（连接Gitee）
      - name: Setup SSH key for Gitee
        env:
          GITEE_SSH_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$GITEE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 把Gitee加入可信列表，避免SSH连接验证
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts

      # 步骤3：同步代码到Gitee
      - name: Sync code to Gitee
        run: |
          # 配置Git用户信息（必须，否则推送会报错）
          git config --global user.name "okasaki_nagi"
          git config --global user.email "okasaki_nagi@qq.com"

          # 添加Gitee仓库为远程仓库（替换成你的Gitee仓库SSH地址）
          git remote add gitee git@gitee.com:okasaki_nagi/The-Sixth-ELement.git

          # 推送代码到Gitee的main分支（强制推送，确保和GitHub完全一致）
          git push -f gitee main:main
