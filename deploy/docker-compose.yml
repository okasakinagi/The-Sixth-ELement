services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    # 不将 MySQL 端口暴露到公网；容器内服务可通过服务名 db 访问
    # 如需在宿主机上访问，改用 127.0.0.1:3306:3306（谨慎）
    # ports:
    #   - "127.0.0.1:3306:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -p${DB_ROOT_PASSWORD} || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    # 生产部署通常不需要把宿主目录挂载到容器，镜像内已经包含应用代码
    healthcheck:
      # 调用 web 容器内的健康端点 /healthz，要求返回 200
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; resp = urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5); assert resp.getcode() == 200",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  frontend:
    image: frontend:latest
    ports:
      - "80:80"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    healthcheck:
      # 同时检查：前端静态页可用 + 前端容器到后端 web 服务的联通性
      test:
        [
          "CMD-SHELL",
          "curl -f -s http://127.0.0.1:80/ >/dev/null && curl -f -s http://web:8000/healthz >/dev/null || exit 1",
        ]
      interval: 10s # 每10秒检查一次
      timeout: 5s # 单次检查超时5秒
      retries: 3 # 连续3次失败标记为unhealthy
      start_period: 30s # 前端启动快，30秒足够

volumes:
  db_data:
  redis_data:
