version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    # 不将 MySQL 端口暴露到公网；容器内服务可通过服务名 db 访问
    # 如需在宿主机上访问，改用 127.0.0.1:3306:3306（谨慎）
    # ports:
    #   - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p${DB_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: backend:latest
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    # 生产部署通常不需要把宿主目录挂载到容器，镜像内已经包含应用代码
    healthcheck:
      # 调用 web 容器内的健康端点 /healthz，要求返回 200
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: frontend:latest
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  db_data:
