# =============================================================================
# 限速区定义（此文件被 include 进 http {} 块，可在此定义 limit_req_zone）
# 每个客户端 IP 共享一个 10MB 的状态区，用于以下限速规则：
#   - guest_api:  访客随机任务接口（无需认证），10 次/分钟
#   - api_global: 全局 API 接口兜底保护，60 次/分钟（防高频爬取/DDOS）
# 如需新增其他规则，在此处仿照格式添加新的 limit_req_zone 即可。
# =============================================================================
limit_req_zone $binary_remote_addr zone=guest_api:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_global:10m rate=60r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # 静态文件直接由 nginx 提供
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------
    # 访客随机任务接口：单独限速（无需认证，防止爬取/滥用）
    # burst=5：允许短暂突发 5 个请求，超出后返回 429
    # nodelay：不排队等待，直接拒绝超出的请求
    # ------------------------------------------------------------------
    location = /api/v1/task-hall/guest-tasks {
        limit_req zone=guest_api burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://web:8000/api/v1/task-hall/guest-tasks;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ------------------------------------------------------------------
    # 全局 API 代理（添加兜底限速，防止高频爬取）
    # burst=20：允许短暂突发 20 个请求
    # ------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_global burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://web:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # 健康检查（不限速，避免影响容器存活检测）
    location /healthz {
        proxy_pass http://web:8000/healthz;
    }
}
